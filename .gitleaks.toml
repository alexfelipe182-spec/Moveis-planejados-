title = "Ideal Marcenaria Gitleaks policy"

[extend]
useDefault = true

# False positives históricos conhecidos: chaves determinísticas usadas somente
# em workflows/testes de CI. As exceções são limitadas à regra generic-api-key
# e aos commits exatos que introduziram esses valores; o restante do histórico
# continua sendo examinado normalmente.
[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "CI-only deterministic test SECRET_KEY values"
commits = [
  "590df38bafeae9a2445cb6446c6014d3a899ac63",
  "edcb26497ab1a4936aa5071bcc20197e2a74d384",
]
