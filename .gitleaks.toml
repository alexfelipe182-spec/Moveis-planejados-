title = "Ideal Marcenaria Gitleaks policy"

[extend]
useDefault = true

# False positive histórico conhecido: chave determinística usada apenas pelo CI
# no commit que aumentou o comprimento do SECRET_KEY de teste. A exceção vale
# somente para a regra generic-api-key e somente para esse commit; as demais
# regras e todos os outros commits continuam sendo examinados normalmente.
[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "CI-only deterministic test SECRET_KEY introduced in 590df38"
commits = ["590df38bafeae9a2445cb6446c6014d3a899ac63"]
