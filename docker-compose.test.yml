services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: marcenaria_db_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marcenaria_db_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/marcenaria_db_test
      SECRET_KEY: ${SECRET_KEY:-docker-test-secret-key-only}
      ENVIRONMENT: test
      PYTHONPATH: /app
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./tests:/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && alembic current && python -m pytest -q -p no:cacheprovider /tests"
