services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marcenaria_db_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marcenaria_db_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/marcenaria_db_test
      ENVIRONMENT: test
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest -q"
