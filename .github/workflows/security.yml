name: Security Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          set -euo pipefail
          GITLEAKS_BIN="$RUNNER_TEMP/bin/gitleaks"
          mkdir -p "$(dirname "$GITLEAKS_BIN")"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$(dirname "$GITLEAKS_BIN")" gitleaks
          chmod +x "$GITLEAKS_BIN"
          "$GITLEAKS_BIN" version

      - name: Scan repository for secrets
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/bin/gitleaks
        run: |
          set +e
          "$GITLEAKS_BIN" detect \
            --source=. \
            --config=.gitleaks.toml \
            --no-banner \
            --redact \
            --report-format=json \
            --report-path="$RUNNER_TEMP/gitleaks-report.json"
          status=$?
          set -e
          if [ -s "$RUNNER_TEMP/gitleaks-report.json" ]; then
            echo "Sanitized Gitleaks findings:"
            jq '[.[] | {RuleID, Description, File, StartLine, Commit, Fingerprint}]' "$RUNNER_TEMP/gitleaks-report.json"
          fi
          exit "$status"

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and pip-audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pip-audit

      - name: Audit dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt

  security-summary:
    name: Security summary
    if: always()
    needs: [secrets, python-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce security gates
        run: |
          echo "secrets=${{ needs.secrets.result }}"
          echo "python-audit=${{ needs.python-audit.result }}"
          test "${{ needs.secrets.result }}" = success
          test "${{ needs.python-audit.result }}" = success
