name: Docker PostgreSQL + Alembic + API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate test Compose file
        run: docker compose -f docker-compose.test.yml config -q

      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q

      - name: Build and test stack
        env:
          SECRET_KEY: docker-test-secret-key-only
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from app
          docker compose -f docker-compose.test.yml ps

      - name: Verify production image runs as non-root
        run: |
          docker build -q -t moveis-planejados-api:ci ./backend
          test "$(docker image inspect moveis-planejados-api:ci --format '{{.Config.User}}')" = "appuser"

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
