name: Docker PostgreSQL + Alembic + API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker + PostgreSQL + Alembic + API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate test Compose file
        run: docker compose -f docker-compose.test.yml config -q

      - name: Validate production Compose file
        run: |
          docker compose \
            --env-file .env.production.example \
            -f docker-compose.prod.yml \
            config -q

      - name: Build and test stack
        env:
          SECRET_KEY: docker-test-secret-key-only
        run: |
          docker compose \
            -f docker-compose.test.yml \
            up \
            --build \
            --abort-on-container-exit \
            --exit-code-from app \
            --remove-orphans

      - name: Build API image
        run: |
          docker build \
            --tag moveis-planejados-api:ci \
            ./backend

      - name: Verify API image metadata
        run: |
          test "$(docker image inspect moveis-planejados-api:ci --format '{{.Config.User}}')" = "appuser"
          test "$(docker image inspect moveis-planejados-api:ci --format '{{json .Config.ExposedPorts}}')" = '{"8000/tcp":{}}'

      - name: Smoke test API container
        run: |
          docker run -d --rm \
            --name moveis-api-ci \
            -p 8000:8000 \
            -e SECRET_KEY=docker-test-secret-key-only \
            -e ENVIRONMENT=test \
            -e DATABASE_URL='postgresql+psycopg://postgres:postgres@host.docker.internal:5432/marcenaria_db' \
            --add-host=host.docker.internal:host-gateway \
            moveis-planejados-api:ci

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done

          docker logs moveis-api-ci
          exit 1

      - name: Verify container is healthy and non-root
        run: |
          docker inspect moveis-api-ci --format '{{.State.Running}}' | grep -qx true
          docker exec moveis-api-ci id -u | grep -vq '^0$'

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.test.yml \
            logs \
            --no-color
          docker logs moveis-api-ci 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f moveis-api-ci 2>/dev/null || true
          docker compose \
            -f docker-compose.test.yml \
            down \
            -v \
            --remove-orphans

  publish-image:
    name: Publish API image to GHCR
    needs: docker-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moveis-planejados-api:latest
            ghcr.io/${{ github.repository_owner }}/moveis-planejados-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
