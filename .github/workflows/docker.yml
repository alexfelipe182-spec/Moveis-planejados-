name: Docker PostgreSQL + Alembic + API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker-test:
    name: Docker + PostgreSQL + Alembic + API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate test Compose file
        run: docker compose -f docker-compose.test.yml config -q

      - name: Validate production Compose file
        run: |
          docker compose \
            --env-file .env.production.example \
            -f docker-compose.prod.yml \
            config -q

      - name: Build and test stack
        env:
          SECRET_KEY: docker-test-secret-key-only
        run: |
          docker compose \
            -f docker-compose.test.yml \
            up \
            --build \
            --abort-on-container-exit \
            --exit-code-from app \
            --remove-orphans

      - name: Verify API image runs as non-root
        run: |
          docker build -q \
            -t moveis-planejados-api:ci \
            ./backend

          test "$(docker image inspect moveis-planejados-api:ci --format '{{.Config.User}}')" = "appuser"

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.test.yml \
            logs \
            --no-color

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            -f docker-compose.test.yml \
            down \
            -v \
            --remove-orphans

  publish-image:
    name: Publish API image to GHCR
    needs: docker-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moveis-planejados-api:latest
            ghcr.io/${{ github.repository_owner }}/moveis-planejados-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
