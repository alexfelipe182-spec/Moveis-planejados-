name: Docker PostgreSQL + Alembic + API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker + PostgreSQL + Alembic + API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate test Compose file
        run: docker compose -f docker-compose.test.yml config -q
      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
      - name: Build and test stack
        env:
          SECRET_KEY: docker-test-secret-key-at-least-32-bytes-long
          ENVIRONMENT: test
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from app --remove-orphans
      - name: Build API image
        run: docker build --tag moveis-planejados-api:ci ./backend
      - name: Verify API image metadata
        run: |
          test "$(docker image inspect moveis-planejados-api:ci --format '{{.Config.User}}')" = "appuser"
          test "$(docker image inspect moveis-planejados-api:ci --format '{{json .Config.ExposedPorts}}')" = '{"8000/tcp":{}}'
      - name: Start smoke-test PostgreSQL
        run: |
          docker network create moveis-ci
          docker run -d --name moveis-db-ci --network moveis-ci \
            -e POSTGRES_DB=marcenaria_db_ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            postgres:18-bookworm
          for i in {1..30}; do
            if docker exec moveis-db-ci pg_isready -U postgres -d marcenaria_db_ci; then exit 0; fi
            sleep 1
          done
          docker logs moveis-db-ci
          exit 1
      - name: Start API container
        run: |
          docker run -d --name moveis-api-ci --network moveis-ci -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@moveis-db-ci:5432/marcenaria_db_ci \
            -e SECRET_KEY=docker-test-secret-key-at-least-32-bytes-long \
            -e ENVIRONMENT=test \
            -e CORS_ORIGINS='["http://localhost:3000"]' \
            moveis-planejados-api:ci
      - name: Smoke test API container
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then exit 0; fi
            if ! docker inspect moveis-api-ci --format '{{.State.Running}}' | grep -qx true; then
              docker logs moveis-api-ci
              exit 1
            fi
            sleep 1
          done
          docker logs moveis-api-ci
          exit 1
      - name: Verify container is healthy and non-root
        run: |
          docker inspect moveis-api-ci --format '{{.State.Running}}' | grep -qx true
          docker exec moveis-api-ci id -u | grep -vq '^0$'
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs --no-color
          docker logs moveis-db-ci 2>/dev/null || true
          docker logs moveis-api-ci 2>/dev/null || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f moveis-api-ci moveis-db-ci 2>/dev/null || true
          docker network rm moveis-ci 2>/dev/null || true
          docker compose -f docker-compose.test.yml down -v --remove-orphans

  publish-image:
    name: Publish API image to GHCR
    needs: docker-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moveis-planejados-api:latest
            ghcr.io/${{ github.repository_owner }}/moveis-planejados-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
