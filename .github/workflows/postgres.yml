name: PostgreSQL + Alembic + API + Autenticação

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend + Frontend validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marcenaria_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d marcenaria_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/marcenaria_db
      PYTHONPATH: backend
      SECRET_KEY: test-secret-key-for-ci-only
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Validate Python bytecode
        run: python -m compileall -q backend

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Validate Alembic state
        working-directory: backend
        run: |
          alembic current
          test "$(alembic heads | grep -c '(head)')" -eq 1

      - name: Run backend tests
        working-directory: backend
        run: pytest -q tests

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate frontend files
        run: |
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/app.js
          grep -q '<script src="./app.js"></script>' frontend/index.html
          grep -q '<link rel="stylesheet" href="./styles.css">' frontend/index.html
