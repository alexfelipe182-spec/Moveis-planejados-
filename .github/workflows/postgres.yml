name: CI - PostgreSQL + Redis + Alembic + API + Frontend

# CI validation checkpoint: Ruff remains the first required backend quality gate.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHONPATH: backend
  DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/marcenaria_db
  REDIS_URL: redis://127.0.0.1:6379/0
  RATE_LIMIT_PER_MINUTE: "120"
  SECRET_KEY: test-secret-key-for-ci-at-least-32-bytes-long
  ENVIRONMENT: test

jobs:
  backend:
    name: Backend quality + PostgreSQL + Redis + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marcenaria_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d marcenaria_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest-cov pip-audit
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q backend
      - name: pip check
        run: python -m pip check
      - name: Verify imports
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python - <<'PY'
          import importlib
          import os
          import sys
          import traceback

          modules = (
              "app.main",
              "app.database",
              "app.models",
              "app.schemas",
              "app.api.auth",
              "app.api.routes",
              "app.api.crud_router",
              "app.core.resilience",
          )

          print("Python:", sys.version)
          print("Working directory:", os.getcwd())
          print("PYTHONPATH:", os.environ.get("PYTHONPATH"))
          print("sys.path:", sys.path)

          for module in modules:
              try:
                  importlib.import_module(module)
              except Exception:
                  print(f"IMPORT FAILED: {module}")
                  traceback.print_exc()
                  raise
              print(f"IMPORT OK: {module}")
          PY
      - name: Verify PostgreSQL
        run: python -c "from sqlalchemy import create_engine,text; import os; e=create_engine(os.environ['DATABASE_URL']); c=e.connect(); assert c.execute(text('select 1')).scalar()==1; c.close(); e.dispose()"
      - name: Verify Redis
        run: python -c "import os; import redis; client=redis.Redis.from_url(os.environ['REDIS_URL']); assert client.ping(); client.set('ci:health','ok',ex=30); assert client.get('ci:health') == b'ok'; client.delete('ci:health')"
      - name: Verify Alembic has one head
        working-directory: backend
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          print('Alembic heads:', heads)
          assert len(heads) == 1, heads
          PY
      - name: Apply and validate migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic current
          alembic heads
      - name: Verify database revision
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from alembic.runtime.migration import MigrationContext
          from sqlalchemy import create_engine
          script = ScriptDirectory.from_config(Config('alembic.ini'))
          expected = tuple(script.get_heads())
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              current = tuple(MigrationContext.configure(conn).get_current_heads())
          print('expected=', expected, 'current=', current)
          assert current == expected
          engine.dispose()
          PY
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q tests --maxfail=1 --strict-config --cov=app --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Audit dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-diagnostics-${{ github.run_id }}
          path: |
            backend/coverage.xml
            backend/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Required files
        run: |
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/professional.css
          test -s frontend/app.js
          test -s frontend/app.test.cjs
          test -s frontend/site-config.js
          test -s frontend/public-contact.js
          test -s frontend/public-contact.test.cjs
          test -s frontend/pagination.test.cjs
          test -s frontend/production.js
          test -s frontend/production.test.cjs
          test -s frontend/smart-quotes.js
          test -s frontend/quote-decisions.js
          test -s frontend/quote-proposal.js
      - name: JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/production.js
          node --check frontend/app.test.cjs
          node --check frontend/site-config.js
          node --check frontend/public-contact.js
          node --check frontend/smart-quotes.js
          node --check frontend/quote-decisions.js
          node --check frontend/quote-proposal.js
      - name: Frontend behavior
        run: node frontend/app.test.cjs
      - name: Public contact behavior
        run: node frontend/public-contact.test.cjs
      - name: Pagination and form behavior
        run: node frontend/pagination.test.cjs
      - name: Production panel behavior
        run: node frontend/production.test.cjs
      - name: HTML assets
        run: |
          grep -q '<script src="./app.js"></script>' frontend/index.html
          grep -q '<script src="./production.js"></script>' frontend/index.html
          grep -q '<script src="./site-config.js"></script>' frontend/index.html
          grep -q '<script src="./public-contact.js"></script>' frontend/index.html
          grep -q '<script src="./smart-quotes.js"></script>' frontend/index.html
          grep -q '<script src="./quote-decisions.js"></script>' frontend/index.html
          grep -q '<script src="./quote-proposal.js"></script>' frontend/index.html
          grep -q '<link rel="stylesheet" href="./styles.css">' frontend/index.html
          grep -q '<link rel="stylesheet" href="./professional.css">' frontend/index.html
      - name: Accidental placeholders
        run: |
          ! grep -RniE 'TODO:.*IMPLEMENT|lorem ipsum|>\s*PLACEHOLDER\s*<' frontend/index.html frontend/styles.css frontend/professional.css frontend/app.js frontend/smart-quotes.js frontend/quote-decisions.js frontend/quote-proposal.js
      - name: Frontend smoke test
        run: |
          python -m http.server 8080 --directory frontend >/tmp/frontend.log 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:8080/ >/tmp/frontend.html && break; sleep 1; done
          grep -q 'Multi-Marcenarias' /tmp/frontend.html
          grep -q 'smart-quotes.js' /tmp/frontend.html
          grep -q 'quote-decisions.js' /tmp/frontend.html
          grep -q 'quote-proposal.js' /tmp/frontend.html

  ci-summary:
    name: CI summary
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required checks
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
