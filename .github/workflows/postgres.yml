name: CI - PostgreSQL + Alembic + API + Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHONPATH: backend
  DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/marcenaria_db
  SECRET_KEY: test-secret-key-for-ci-only
  ENVIRONMENT: test

jobs:
  test:
    name: Backend + Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marcenaria_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d marcenaria_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest-cov pip-audit ruff

      - name: Check Python lint
        working-directory: backend
        run: ruff check .

      - name: Validate Python bytecode
        run: python -m compileall -q backend

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Verify application imports
        working-directory: backend
        run: |
          python -c "import app.main; import app.database; import app.models; import app.schemas; import app.api.auth; import app.api.routes"

      - name: Verify PostgreSQL connection
        working-directory: backend
        run: python -c "from sqlalchemy import create_engine, text; import os; e=create_engine(os.environ['DATABASE_URL']); c=e.connect(); assert c.execute(text('select 1')).scalar()==1; c.close(); e.dispose()"

      - name: Verify Alembic has exactly one migration head
        working-directory: backend
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          heads = script.get_heads()
          print(f"Alembic heads: {heads}")
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {len(heads)}: {heads}")
          PY

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Validate Alembic state and schema
        working-directory: backend
        run: |
          alembic current
          alembic heads
          alembic check

      - name: Verify database revision matches migration head
        working-directory: backend
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from alembic.runtime.migration import MigrationContext
          from sqlalchemy import create_engine
          import os

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          expected = script.get_heads()
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              current = MigrationContext.configure(connection).get_current_heads()
          print(f"Expected migration head: {expected}")
          print(f"Database migration heads: {current}")
          if tuple(current) != tuple(expected):
              raise SystemExit("Database revision does not match the Alembic head")
          engine.dispose()
          PY

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          python -m pytest -q tests --maxfail=1 --strict-config \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Audit Python dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate frontend files
        run: |
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/app.js
          grep -q '<script src="./app.js"></script>' frontend/index.html
          grep -q '<link rel="stylesheet" href="./styles.css">' frontend/index.html
          test "$(find frontend -maxdepth 1 -type f | wc -l)" -ge 3

      - name: Check frontend for accidental placeholders
        run: |
          if grep -RniE 'PLACEHOLDER|TODO:.*IMPLEMENT|lorem ipsum' frontend --exclude='*.map'; then
            echo 'Found accidental placeholder content in frontend.'
            exit 1
          fi

      - name: Smoke test frontend locally
        run: |
          python -m http.server 8080 --directory frontend >/tmp/frontend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/tmp/frontend.html; then break; fi
            sleep 1
          done
          grep -q 'Marcenaria Ideal' /tmp/frontend.html

      - name: Upload test and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            backend/coverage.xml
            backend/.pytest_cache
            backend/alembic
            /tmp/frontend.log
          if-no-files-found: ignore
          retention-days: 14
