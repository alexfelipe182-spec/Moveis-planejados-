name: CI - PostgreSQL + Alembic + API + Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHONPATH: backend
  DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/marcenaria_db
  SECRET_KEY: test-secret-key-for-ci-only
  ENVIRONMENT: test

jobs:
  backend:
    name: Backend quality + database + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marcenaria_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d marcenaria_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest-cov pip-audit
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q backend
      - name: pip check
        run: python -m pip check
      - name: Verify imports
        working-directory: backend
        run: python -c "import app.main; import app.database; import app.models; import app.schemas; import app.api.auth; import app.api.routes"
      - name: Verify PostgreSQL
        run: python -c "from sqlalchemy import create_engine,text; import os; e=create_engine(os.environ['DATABASE_URL']); c=e.connect(); assert c.execute(text('select 1')).scalar()==1; c.close(); e.dispose()"
      - name: Verify Alembic has one head
        working-directory: backend
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          print('Alembic heads:', heads)
          assert len(heads) == 1, heads
          PY
      - name: Apply and validate migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic current
          alembic heads
      - name: Verify database revision
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from alembic.runtime.migration import MigrationContext
          from sqlalchemy import create_engine
          script = ScriptDirectory.from_config(Config('alembic.ini'))
          expected = tuple(script.get_heads())
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              current = tuple(MigrationContext.configure(conn).get_current_heads())
          print('expected=', expected, 'current=', current)
          assert current == expected
          engine.dispose()
          PY
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q tests --maxfail=1 --strict-config --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Audit dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-diagnostics-${{ github.run_id }}
          path: |
            backend/coverage.xml
            backend/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Required files
        run: test -s frontend/index.html && test -s frontend/styles.css && test -s frontend/professional.css && test -s frontend/app.js && test -s frontend/smart-quotes.js
      - name: JavaScript syntax
        run: node --check frontend/app.js && node --check frontend/smart-quotes.js
      - name: HTML assets
        run: |
          grep -q '<script src="./app.js"></script>' frontend/index.html
          grep -q '<script src="./smart-quotes.js"></script>' frontend/index.html
          grep -q '<link rel="stylesheet" href="./styles.css">' frontend/index.html
          grep -q '<link rel="stylesheet" href="./professional.css">' frontend/index.html
      - name: Accidental placeholders
        run: |
          ! grep -RniE 'TODO:.*IMPLEMENT|lorem ipsum|>\s*PLACEHOLDER\s*<' frontend/index.html frontend/styles.css frontend/professional.css frontend/app.js frontend/smart-quotes.js
      - name: Frontend smoke test
        run: |
          python -m http.server 8080 --directory frontend >/tmp/frontend.log 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:8080/ >/tmp/frontend.html && break; sleep 1; done
          grep -q 'Marcenaria Ideal' /tmp/frontend.html
          grep -q 'smart-quotes.js' /tmp/frontend.html

  ci-summary:
    name: CI summary
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required checks
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
