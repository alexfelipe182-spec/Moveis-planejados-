name: PostgreSQL + Alembic + API + Autenticação

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHONPATH: backend
  DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/marcenaria_db
  SECRET_KEY: test-secret-key-for-ci-only
  ENVIRONMENT: test

jobs:
  test:
    name: Backend + Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marcenaria_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d marcenaria_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check Python lint
        working-directory: backend
        run: ruff check .

      - name: Validate Python bytecode
        run: python -m compileall -q backend

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Verify PostgreSQL connection
        working-directory: backend
        run: python -c "from sqlalchemy import create_engine, text; e=create_engine(__import__('os').environ['DATABASE_URL']); c=e.connect(); assert c.execute(text('select 1')).scalar()==1; c.close(); e.dispose()"

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Validate Alembic state
        working-directory: backend
        run: |
          alembic current
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic check

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q tests --maxfail=1 --strict-config

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate frontend files
        run: |
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/app.js
          grep -q '<script src="./app.js"></script>' frontend/index.html
          grep -q '<link rel="stylesheet" href="./styles.css">' frontend/index.html
          test "$(find frontend -maxdepth 1 -type f | wc -l)" -ge 3

      - name: Check frontend has no accidental placeholder
        run: |
          if grep -RniE 'PLACEHOLDER|TODO:.*IMPLEMENT|lorem ipsum' frontend --exclude='*.map'; then
            echo 'Found accidental placeholder content in frontend.'
            exit 1
          fi

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            backend/.pytest_cache
            backend/alembic
          if-no-files-found: ignore
          retention-days: 7
