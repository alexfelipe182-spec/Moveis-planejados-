services:
  - type: web
    name: moveis-planejados-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moveis-planejados-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://moveis-planejados-api.onrender.com"]'
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

databases:
  - name: moveis-planejados-db
    plan: free
    region: ohio
    postgresMajorVersion: "16"
