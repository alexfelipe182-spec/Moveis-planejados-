services:
  - type: web
    name: ideal-marcenaria-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    plan: free
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: Ideal
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ideal-marcenaria-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: '["https://multi-marcenarias.onrender.com"]'
      - key: FRONTEND_URL
        value: https://multi-marcenarias.onrender.com

  # O frontend oficial multi-marcenarias é um serviço existente gerenciado
  # separadamente. Não declarar frontends demo/legados evita duplicação.

  - type: keyvalue
    name: ideal-marcenaria-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: Ideal
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: ideal_1zre
    user: ideal_1zre_user
